# ─────────────────────────────────────────────────────────────────────────────
# medprom-metmal — VPS stack (API saja; frontend di Vercel)
#
# Topologi:
#   Caddy host (443, metmal.andotherstori.my.id dsb.)
#     └─ reverse_proxy <subdomain> → 127.0.0.1:3002
#          └─ api (node:20-alpine, server/src/index.js)
#               └─ postgres 16 (volume pgdata)
#
# Frontend: `npm ci && npm run build` di host → `vercel deploy` (VITE_API_URL =
# https://<api-subdomain>). Frontend TIDAK di-serve dari VPS ini.
#
# Prasyarat:
#   - Repo root di-bind-mount read-only + node_modules named volume.
#   - cp deploy/vps/.env.example .env → isi → docker compose up -d
# ─────────────────────────────────────────────────────────────────────────────

name: medprom

services:
  postgres:
    image: postgres:16-alpine
    container_name: medprom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medprom}
      POSTGRES_USER: ${POSTGRES_USER:-medprom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?isi POSTGRES_PASSWORD di .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medprom} -d ${POSTGRES_DB:-medprom}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    # TANPA mapping port host — tooling via `docker compose exec postgres psql`.
    networks:
      - medprom
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  api:
    image: node:20-alpine
    container_name: medprom-api
    restart: unless-stopped
    working_dir: /srv/app
    command: >
      sh -c 'if [ ! -d node_modules/pg ]; then
        npm ci --omit=dev --no-audit --no-fund;
      fi &&
      exec node server/src/index.js'
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: "3002"
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL:?isi DATABASE_URL di .env}
      JWT_SECRET: ${JWT_SECRET:?isi JWT_SECRET di .env}
      # Lintas-origin FE Vercel → API subdomain: cookie WAJIB SameSite=None + Secure.
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-none}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      # Origin FE produksi (exact-match, dipisah koma bila lebih dari satu).
      CORS_ORIGIN: ${CORS_ORIGIN:?isi CORS_ORIGIN di .env}
      # MID tenant roster — opsional; kosong = pencarian gerai menolak dengan
      # pesan konfigurasi (submit tetap jalan, gerai diketik manual tidak
      # didukung; isi begitu Metland memberikan key).
      MID_API_KEY: ${MID_API_KEY:-}
      # Storage media — Google Drive (akun mediapromosi.metmalbekasi@gmail.com).
      # Refresh token diproduksi scripts/drive-auth.mjs dari mesin lokal.
      # SENGAJA opsional (`:-`), bukan wajib (`:?`): kanal unggah berkas adalah
      # fitur fail-closed — bila kredensial kosong, `driveReady` di drive.js
      # membuat POST /drive/upload membalas 503 sementara kanal tautan (kanonis)
      # tetap jalan penuh. Membuatnya wajib akan memblokir boot seluruh API
      # hanya karena fitur opsional belum dikonfigurasi.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REFRESH_TOKEN: ${GOOGLE_REFRESH_TOKEN:-}
      DRIVE_ROOT_FOLDER_ID: ${DRIVE_ROOT_FOLDER_ID:-}
      # Gambar katalog yang diunggah staf. Repo read-only, jadi gambar
      # disimpan di volume terpisah (lihat server/src/media.js).
      MEDIA_DIR: /data/media
    volumes:
      # Repo root (server/ + schema) — read-only.
      - ../../:/srv/app:ro
      # node_modules terpisah (instalasi container alpine bersih).
      - node_modules:/srv/app/node_modules
      # Gambar katalog hasil unggahan staf — WAJIB writable.
      - media:/data/media
    ports:
      # Hanya loopback host — Caddy reverse_proxy 127.0.0.1:3002.
      - "127.0.0.1:3002:3002"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - medprom
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  pgdata:
  node_modules:
  media:

networks:
  medprom:
    driver: bridge
