<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <!-- interactive-widget=resizes-content: keyboard Android menyusutkan viewport,
         bukan menimpa UI — footer wizard dan isi sheet tetap terlihat saat mengetik -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Media Promosi Metropolitan Mall Bekasi</title>
    <meta name="description" content="Ajukan dan unggah materi media promosi tenant Anda ke Tim Tenant Relations Metropolitan Mall Bekasi. Spanduk, LED, videotron, hingga media sosial, tertata dalam satu platform." />

    <!-- Theme color: putih, satu-satunya nilai (keputusan audit 2026-10-01:
         aplikasi belum punya dark mode; manifest PWA diselaraskan di sini
         sejak lapisan platform mobile 2026-11-17) -->
    <meta name="theme-color" content="#ffffff" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Media Promosi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Media Promosi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Media Promosi Metropolitan Mall Bekasi" />
    <meta property="og:description" content="Ajukan dan unggah materi media promosi tenant Anda ke Tim Tenant Relations Metropolitan Mall Bekasi." />
    <meta property="og:site_name" content="Metropolitan Mall Bekasi" />
    <meta property="og:locale" content="id_ID" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Font: Inter (substitusi resmi Airbnb Cereal VF; arah Rausch 2026-11-17) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" /></noscript>

    <style>
      /* Critical CSS: skeleton sebelum JS mount (root.render menggantikan #root).
       * Nilai di sini HARUS cocok dengan token di src/styles/theme.css: skeleton
       * tampil sebelum CSS itu termuat, jadi ia tidak bisa memakai var(). */
      #root > .app-skeleton { display: block; }
      .app-skeleton { background: #ffffff; min-height: 100vh; color: #6a6a6a; }
      .app-skeleton .sk-nav { height: 56px; border-bottom: 1px solid #ebebeb; display: flex; align-items: center; padding: 0 24px; gap: 12px; }
      .app-skeleton .sk-brand { width: 140px; height: 20px; border-radius: 10px; background: #f2f2f2; }
      .app-skeleton .sk-hero { height: 240px; background: #ffffff; display: flex; align-items: center; padding: 0 32px; border-bottom: 1px solid #ebebeb; }
      .app-skeleton .sk-hero-inner { width: min(520px, 80%); display: flex; flex-direction: column; gap: 14px; }
      .app-skeleton .sk-title { height: 28px; border-radius: 10px; background: #ebebeb; width: 70%; }
      .app-skeleton .sk-sub { height: 16px; width: 50%; border-radius: 10px; background: #f2f2f2; }
      .app-skeleton .sk-grid { display: grid; gap: 16px; padding: 24px 32px; }
      .app-skeleton .sk-card { height: 88px; border-radius: 14px; background: #ffffff; border: 1px solid #ebebeb; }
      @media (prefers-reduced-motion: no-preference) {
        .app-skeleton .sk-brand, .app-skeleton .sk-title, .app-skeleton .sk-sub, .app-skeleton .sk-card { animation: sk-pulse 1.6s ease-in-out infinite; }
        @keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-skeleton" aria-hidden="true">
        <div class="sk-nav"><div class="sk-brand"></div></div>
        <div class="sk-hero"><div class="sk-hero-inner"><div class="sk-title"></div><div class="sk-sub"></div><div class="sk-sub" style="width:50%"></div></div></div>
        <div class="sk-grid"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
