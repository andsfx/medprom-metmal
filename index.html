<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Media Promosi Metropolitan Mall Bekasi</title>
    <meta name="description" content="Ajukan dan unggah materi media promosi tenant Anda ke Tim Tenant Relations Metropolitan Mall Bekasi. Spanduk, LED, videotron, hingga media sosial, tertata dalam satu platform." />

    <!-- Theme color: tosca saat terpasang sebagai app (status bar ikut warna) -->
    <meta name="theme-color" content="#00918E" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0f172a" media="(prefers-color-scheme: dark)" />

    <!-- PWA -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="application-name" content="Media Promosi" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Media Promosi" />
    <meta name="mobile-web-app-capable" content="yes" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Media Promosi Metropolitan Mall Bekasi" />
    <meta property="og:description" content="Ajukan dan unggah materi media promosi tenant Anda ke Tim Tenant Relations Metropolitan Mall Bekasi." />
    <meta property="og:site_name" content="Metropolitan Mall Bekasi" />
    <meta property="og:locale" content="id_ID" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- Fonts: Fraunces (display) + Geist (body) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300..700&family=Geist:wght@400;500;600;700&display=swap" /></noscript>

    <style>
      /* Critical CSS: skeleton sebelum JS mount (root.render menggantikan #root) */
      #root > .app-skeleton { display: block; }
      .app-skeleton { background: #ffffff; min-height: 100vh; color: #64748b; }
      .app-skeleton .sk-nav { height: 56px; border-bottom: 1px solid #e7e5e4; display: flex; align-items: center; padding: 0 24px; gap: 12px; }
      .app-skeleton .sk-brand { width: 140px; height: 20px; border-radius: 4px; background: #e7e5e4; }
      .app-skeleton .sk-hero { height: 240px; background: #ffffff; display: flex; align-items: center; padding: 0 32px; }
      .app-skeleton .sk-hero-inner { width: min(520px, 80%); display: flex; flex-direction: column; gap: 14px; }
      .app-skeleton .sk-title { height: 28px; border-radius: 4px; background: #d6d3d1; width: 70%; }
      .app-skeleton .sk-sub { height: 16px; width: 50%; border-radius: 4px; background: #e7e5e4; }
      .app-skeleton .sk-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 24px 32px; }
      .app-skeleton .sk-card { height: 140px; border-radius: 8px; background: #fafaf9; border: 1px solid #e7e5e4; }
      @media (prefers-color-scheme: dark) {
        .app-skeleton { background: #0f172a; color: #94a3b8; }
        .app-skeleton .sk-nav { border-bottom-color: #1e293b; }
        .app-skeleton .sk-brand, .app-skeleton .sk-sub { background: #1e293b; }
        .app-skeleton .sk-card { background: #1e293b; border-color: #334155; }
        .app-skeleton .sk-hero { background: #0f172a; }
        .app-skeleton .sk-title { background: #1e293b; }
      }
      @media (prefers-reduced-motion: no-preference) {
        .app-skeleton .sk-brand, .app-skeleton .sk-title, .app-skeleton .sk-sub, .app-skeleton .sk-card { animation: sk-pulse 1.6s ease-in-out infinite; }
        @keyframes sk-pulse { 0%, 100% { opacity: 1; } 50% { opacity: .55; } }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="app-skeleton" aria-hidden="true">
        <div class="sk-nav"><div class="sk-brand"></div></div>
        <div class="sk-hero"><div class="sk-hero-inner"><div class="sk-title"></div><div class="sk-sub"></div><div class="sk-sub" style="width:50%"></div></div></div>
        <div class="sk-grid"><div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div></div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
